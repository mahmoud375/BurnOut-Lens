[project]
name = "burnout-lens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "pyarrow>=18.0",
    "shap>=0.47.2",
    "xgboost-cpu>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.9.0",
    "seaborn>=0.13.2",
]

# ---------------------------------------------------------------------------
# Ruff linter configuration — enforced in CI via `ruff check .`
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, RUF: ruff-specific, BLE: blind except,
# TRY: exception handling best practices
select = ["E", "W", "F", "I", "RUF", "BLE", "TRY"]
# TRY401: logger.exception() already logs exc — flagged and fixed at source
# TRY003: long messages in raise — reasonable for a small project
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is expected (pytest), magic numbers are fine in test data
"tests/*" = ["S101", "PLR2004"]


# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Run from the ml/ directory so `from src import ...` resolves correctly.
testpaths = ["tests"]
pythonpath = ["."]          # adds ml/ to sys.path -> enables `from src import config`
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]

# Tell uv/setuptools that packages live in ml/ (the project root), so
# `src` is discovered as a package and `from src import config` works
# correctly even when installed as an editable dep from backend/.
[tool.setuptools.packages.find]
where = ["."]
