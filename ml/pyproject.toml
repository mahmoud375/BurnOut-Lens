[project]
name = "burnout-lens"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "shap>=0.47.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "seaborn>=0.13.2",
]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Run from the ml/ directory so `from src import ...` resolves correctly.
testpaths = ["tests"]
pythonpath = ["."]          # adds ml/ to sys.path -> enables `from src import config`
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]
