name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # ML layer — unit + integration tests
  # ---------------------------------------------------------------------------
  ml-tests:
    name: ML Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-ml-${{ runner.os }}-${{ hashFiles('ml/uv.lock') }}
          restore-keys: uv-ml-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --python 3.12 --frozen

      - name: Run tests
        run: uv run pytest -v

  # ---------------------------------------------------------------------------
  # Backend — FastAPI unit + integration tests
  #
  # The backend depends on ml/ as an editable local package:
  #   [tool.uv.sources] burnout-lens = { path = "../ml", editable = true }
  # A full repo checkout makes both directories available, so the editable
  # install (which points at ../ml relative to backend/) resolves correctly
  # on the CI runner exactly as it does locally.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-backend-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-backend-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --python 3.12 --frozen

      - name: Run tests
        run: uv run pytest -v

  # ---------------------------------------------------------------------------
  # Lint — ruff in check mode only (never auto-fixes in CI)
  # Configured in [tool.ruff] sections of ml/ and backend/ pyproject.toml.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"

      - name: Install ruff
        run: uv tool install ruff

      - name: Lint ml/
        run: uv tool run ruff check ml/src/ ml/tests/

      - name: Lint backend/
        run: uv tool run ruff check backend/app/ backend/tests/

  # ---------------------------------------------------------------------------
  # Frontend — TypeScript check + production build
  # No test framework by design; tsc + vite build passing is the CI signal.
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build
        env:
          # Vite bakes this into the JS bundle at build time. Any valid URL
          # works for CI — the artifact is never deployed from this job.
          VITE_API_BASE_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # Docker build sanity check — verifies both Dockerfiles still build on every
  # push/PR WITHOUT pushing anywhere. Uses GitHub Actions cache for speed.
  # The actual push to Docker Hub only happens in cd.yml on merges to main.
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: burnoutlens-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: burnoutlens-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
