services:
  backend:
    image: elgendy2003/burnout-lens-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ORIGINS: "http://68.210.99.220,http://burnoutlens.tech,https://burnoutlens.tech"
    restart: unless-stopped
    mem_limit: 400m
    cpus: 0.5

  frontend:
    image: elgendy2003/burnout-lens-frontend:latest
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 100m
    cpus: 0.3
